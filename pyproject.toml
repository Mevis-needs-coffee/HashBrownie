[project]
name = "hashbrownie"
version = "0.1.0"
description = "A small hash identifier - identify cryptographic hash types by shape"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
hashbrownie = "hashbrownie:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pylint>=3.0.0",
]
